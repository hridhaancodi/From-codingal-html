<html>
    <head>
        <title>Shooping online</title>
        <style>
          body{
            font-family: aerial;
            background-color: rgb(215, 215, 142);
            padding: 30px;
        
          }
          ul > li{
            list-style: none;
            font-size: 18px;
            font-weight: bold;
            color: rgb(135, 154, 222);
            border-radius: 8px;
            background-color: chartreuse;
          }
        ul li:nth-child(3)
          {
            background-color: red;
            color: white;
          }
          .dese{
            color: blueviolet;
            margin-top: 20px;
            border-radius: 10px;
            margin-left: auto;
            margin-right: auto;
            font-size: 15px;
          }
          .dese::first-letter{
            font-size: 200%;
            color: orange;
          }
          a{
            color: brown;
            text-decoration: none;
            margin: 0 12px;
            padding: 8px 18px;
          }
          a:hover{
            color: chocolate;
            background-color: green;
          }
          .links{
            margin-top: 25px;
          }
          ul{
            padding: 0;
            margin-top: 20px;
          }
          h1{
            color: magenta;
          }
          h1+p{
            background-color: darksalmon;
            border-radius: 10px;
          }
        </style>
        </head>
        <body>
            <h1>Pick your items!</h1>
            <ul>
                <li>Washing mashine</li>
                <li>Iphone17 pro max</li>
                <li>Oven</li>
                <li>microwave</li>
                <li>Air fryer</li>
            </ul>
            <p class="dese">This shops lets you pick your items onlie making your item on your door step instead of going outside nad buying.</p>
            <div class="links">
                <a href="#">Order now </a>
                <a href="#">See more </a>
            </div>
        </body>
</html>
