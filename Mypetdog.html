<html>
    <head>
        <title>My Pet Dog</title>
        <style>
            body{
                background-color: lightyellow;
                padding: 65px 30px 30px 30px;
                min-height: 1800px;
            }
            h1, h2 {color:darkorange}

            .top-bar{
                position: fixed;
                top: 0;
                right: 0;
                left: 0;
                background-color: darkorange;
                color: white;
                padding: 14px 20px;
            }

            .list-item{
                background-color: white;
                border: 2px solid darkorange;
                padding: 20px 20px;
                margin: 5px;
            }

            .special-note{
                position: relative;
                left: 5px;
                background-color: gold;
                padding: 10px 20px;
            }
          
            .pet-card{
                position: relative;
                color: darkorange;
                border: 2px 3px;
                padding: 10px 20px;
            }

            .badge{
                position: absolute;
                background-color: forestgreen;
                color: white;
                padding: 4px 8px;
                right: 8px;
                top: 8px;
            }

            .section-label{
                position: sticky;
                background-color: darkorange;
                color: white;
                padding: 10px 20px;
                top: 55px;
                margin: 15px 0px 8px;
            }
        </style>
    </head>
    <body>
        <div class="top-bar">Meet buddy-Golden Retriver</div>
        <h1>Meet Buddy!</h1>
        <h2>Static</h2>
        <div class="list-item">Breed Golden Retriver</div>
        <div class="list-item">Age:2</div>
        <div class="special-note">Pet of the month!</div>
        <div class="pet-card">
            <p>Golden Retriver-2 years</p>
            <div class="badge">Adopted</div>
        </div>
        <div class="section-label">More options available</div>
          <div class="list-item">

German Shepherd, 3 years
          </div> 
          <div class="list-item">Luna - Poodle, 1 year</div>
    </body>
</html>
