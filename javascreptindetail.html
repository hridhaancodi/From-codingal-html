<html>
    <head>
        <title>My Magic Word Lab</title>
        <link rel="stylesheet"

href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
      <style>
        body { background: lightyellow;}
        h1, h3 { color: darkorange; }
      </style>
    </head>
    <body>
        <div class="container py-4">
            <h1 class="mb-1">My Magic Word Lab</h1>
            <p class="text-muted mb-4">Discover types, switch them, find and swap words, and carch sneaky errors!</p>
            <div class="card mb-4"><div class="card-body">
                <h3 class="card-title">What Type Is It?</h3>
                <button class="btn btn-primary" onclick="checkTypes()">Reveal the Types!</button>
                <div id="typeResult" class="box p-3 mt-3 rounded">Press the button to reveal the secret types!</div>
      </div></div>

      <script>
        var sen = "The dragon flew over the big castle.";
        function checkTypes() {
            document.getElementById("typeResult").innerText =
            "Score 42     -type: "+ typeof 42 + "\n" +
            "Name 'Alex'    -type: "+ typeof "Alex" + "\n" +
            "Game over true  -type: " + typeof true;
        }
      </script>
    </body>
</html>
