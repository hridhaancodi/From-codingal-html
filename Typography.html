<html>
    <head>
        <title>Typography</title>
        <style>
           body{
            background-color: aqua;
            color: yellow;
            font-family: 'Times New Roman', Times, serif;
           }

           .hero-name{
            font-size: 60px;
            font-weight: bold;
            color: yellow;
            text-shadow: 3px 3px orange;
           }

           /* typography + Text Transform - tagline becomes Title Case */
           .tagline{
            font-style: italic;
            color: red;
            text-transform: capitalize;
           }
           .label{
            text-transform: uppercase;
            text-decoration: underline overline;
           }
           .power{
            font-weight: bold;
            text-decoration:  line-through;
            color: gray;
           }
           .badge{
            font-size: 30px;
            transform: rotate(15deg);
            color: gold;
           }
        </style>
    </head>
    <body>

        <center>
        <h1 class=hero-name>Thunder kid</h1>
       <p class=tagline>Most power hero in this school</p>
        <h2 class=label>Superpower</h2>
        <p class=power>Good in study</p>
        <p class=power>Can run faster</p>
        <p class=badge>Top hero</p>
        </center>
    </body>
</html>
