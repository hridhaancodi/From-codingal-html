<!DOCTYPE html>
<html>
<head>
    <title>Shopping List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>

<body class="container mt-4">

    <h2>Add your shopping items here</h2>

    <input type="text" id="itemInput" placeholder="Enter shopping item">

    <button class="btn btn-primary" onclick="addItem()">Add</button>

    <h2 class="mt-4">Shopping List</h2>

    <ul id="shoppingList" class="list-group"></ul>

    <h2 class="mt-4">Shopping Products</h2>

    <!-- Bootstrap Image Grid -->
    <div class="row g-3">

        <div class="col-md-3 col-6">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6"
                     class="card-img-top product-img" alt="Apple">
                <div class="card-body">
                    <h5 class="card-title">Apple</h5>
                </div>
            </div>
        </div>

        <div class="col-md-3 col-6">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1558961363-fa8fdf82db35"
                     class="card-img-top product-img" alt="Biscuits">
                <div class="card-body">
                    <h5 class="card-title">Biscuits</h5>
                </div>
            </div>
        </div>

        <div class="col-md-3 col-6">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1593359677879-a4bb92f829d1"
                     class="card-img-top product-img" alt="TV">
                <div class="card-body">
                    <h5 class="card-title">TV</h5>
                </div>
            </div>
        </div>

        <div class="col-md-3 col-6">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1585659722983-3a675dabf23d"
                     class="card-img-top product-img" alt="Oven">
                <div class="card-body">
                    <h5 class="card-title">Oven</h5>
                </div>
            </div>
        </div>

    </div>

    <script>

        function addItem() {

            var myInput = document.getElementById("itemInput");
            var myItem = document.getElementById("shoppingList");

            var inputItems = myInput.value.trim();

            if (inputItems === "") {
                return;
            }

            var li = document.createElement("li");

            li.className = "list-group-item d-flex justify-content-between align-items-center";

            var itemText = document.createElement("span");
            itemText.textContent = inputItems;

            var deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";
            deleteButton.className = "btn btn-danger btn-sm";

            deleteButton.onclick = function() {
                li.remove();
            };

            li.appendChild(itemText);
            li.appendChild(deleteButton);

            myItem.appendChild(li);

            myInput.value = "";
        }

    </script>

</body>
</html>
