<html>
    <head>
        <title>

        </title>
    </head>
    <body>

        <h1>Lucky Draw</h1>
        <p>Enter your name and guess a numner to win!</p>

        <input type="text" id="name" placeholder="Your name" required><br>
        <p id="msg-name"></p>

        <input type="number" id="guess" placeholder="Guess a number (1 to 5)" min="1" max="5" required><br>
        <p id="msg-guess"></p>

        <button onclick="checkForm()">Try My Luck!</button>
        <p id="result"></p>
        <p id="timer"></p> 

        <script>
         var seconds = 0;
         setInterval(function() {
        document.getElementById("titmer").textContent = "You have been here for " + seconds + "seconds!";
         }, 1000);

         function checkForm(){
            var name = document.getElementById("name").value;
             var guess = document.getElementById("guess").value;
              var ok = true;

              if (name == "") {
                document.getElementById("msg-name").textContet = "Please enter your name!";
                document.getElementById("msg-name").style.color = "red";
                ok = false;
             }   else {
                document.getElementById("msg-name").textContet = "Great Name!";
                document.getElementById("msg-name").style.color = "green";
             }
              if (guess == "") {
                document.getElementById("msg-guess").textContet = "Please enter your guess!";
                document.getElementById("msg-guess").style.color = "red";       
            } else {
                document.getElementById("msg-name").textContet = "Guess Saved!";
                document.getElementById("msg-name").style.color = "Green";
            }

            if (ok == true) {
                var lucky = Math.floor(Math.random() * 5)+ 1;
                if (guess == lucky) {
                    document.getElementById("result").textContent = "You win, "+ name + "! The luck number was "+ lucky + "!";
                     document.getElementById("result").style.color = "green";     
                }else {
                    document.getElementById("result").textContent = "So close, "+ name + "! The luck number was "+ lucky + ". Try again!";
                document.getElementById("result").style.color = "navy";             
              }
            }
        }
     </script>
    </body>
</html>
