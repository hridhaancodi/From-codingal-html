<html>
    <head>

    </head>
    <title>My Superhero Power Cards</title>

    <style>
        body {
            font-family: Arial sans-serif;
            background-color: #f0f4ff;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #ff4d4d;
        }

        p {
            color: #444444;
        }

        button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .hero-card {
            background-color: white;
            border: 3px solid #ff4d4d;
            border-radius: 12px;
            color: #222222;
        }

        .hero-power {
            color: #0057b8;
            font-weight: bold;
        }

        .hero-mission {
            color: #666666;
            font-size: 14px;
        }
    </style>
    <body>

        <h1>My Superhero Power Cards</h1>

        <p>
            Click the button to create superhero objects using JavaScript classes
        </p>

        <button onclick="showHeroes()">Show Superheroes</button>

        <div class="card-container" id="heroCards"></div>
        <script>
            class Superhero {
                constructor(name, power, mission) {
                    this.name = name;
                    this.power = power;
                    this.mission = mission;
                }

                describeHero() {
                    return "<div class='hero-card'>" +
                        "<p class='hero-name'>" + this.name + "</p>" +
                         "<p class='hero-power'>Power: " + this.power + "</p>" +
                          "<p class='hero-mission'>Mission" + this.mission + "</p>" +
                          "</div>";
                }
            }

            function showHeroes() {
                let hero1 = new Superhero(
                    "Captain Code",
                    "Debugging errors",
                    "Fix broken program and save the coding world."
                );

                let hero2 = new Superhero(
                    "Pixel Flash",
                    "Super speed design",
                    "build colourful websites in seconds."
                );
                
                let hero3 = new Superhero(
                    "logic Girl",
                    "Smart problem-solving",
                    "Use logic to solve tricky challenges."
                );

                let hero4 = new Superhero(
                    "Data Knight",
                   "Data protection",
                   "Keep important information safe."
                );

                document.getElementById("heroCards").innerHTML =
                herohero1.describe()+
                herohero2.describe()+
                herohero3.describe()+
                herohero4.describe();
            }
        </script>
    </body>
</html>
