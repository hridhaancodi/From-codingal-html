<html>
    <head>
        <meta charset="UTF-8">
        <title>My Favourite Person Profile</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body { background-color: #F0F0F2; }
            h1   { color: #FF5A43; }
            .card-label { font-size: 11px; color: #999; text-transform: uppercase; }
            pre {font-size: 13px; color: #333; }
        </style>
    </head>
    <body class="py-4">

        <div class="container">
            <h1 class="mb-1"> My Favourite Person Profile</h1>
            <p class="text-muted mb-4">Introduction to Oblects in JavaScript</p>

            <div class="card shadow-sm mb-3" style="max-width:400px;">
                <div class="card-body">
                    <h5 class="card-title" style="color: #FF5A43;">Profile Details</h5>
                    <ul class="list-group list-flush">
                        <li class="list-group-item"><span class="card-lable
                            d-block">Name</span><strong id="strong id="name">-</strong></li>
                            <li class="list-group-item"><span class="card-lable
                            d-block">Relationship</span><strong id="strong id="relationship">-</strong></li>
                            <li class="list-group-item"><span class="card-lable
                            d-block">Favourite activity</span><strong id="strong id="activity">-</strong></li>
                            <li class="list-group-item"><span class="card-lable
                            d-block">City</span><strong id="strong id="city">-</strong></li>
                    </ul>
                </div>
            </div>

            <div class="card shadow-sm" style="max-width: 400px;">
                <div class="card-body">
                 <h6 style="color: #FF5A43;">Javascript Object Used</h6>
                 <pre id="codeDisplay" class="bg-light p-3 rounded border mb-0"></pre>
                </div>
            </div>
        </div>

        <script>
  const favouritePerson = {
    name: "Samarth",
    relationship: "Friend",
    activity: "Playing football",
    city: "Jakarta"
  };
  console.log(favouritePerson.name);
  console.log(favouritePerson.relationship);
  console.log(favouritePerson["activity"]);
  console.log(favouritePerson["city"]);
  console.log(favouritePerson);

        </script>
    </body>
</html>
